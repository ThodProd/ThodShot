name: release
on:
  push:
    branches: [main]
    paths: ['rust/**', 'hub/**', 'Cargo.toml', 'Cargo.lock', 'build.rs', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: thodshot-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ThodProd/ThodHUB
          path: hub-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Tests
        run: |
          cargo fmt --all --check
          cargo test --locked --target x86_64-pc-windows-msvc
      - name: Версия
        id: v
        shell: pwsh
        run: |
          $m = Get-Content hub/manifest.json -Raw | ConvertFrom-Json
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $crate = $metadata.packages | Where-Object name -eq thodshot
          if ($crate.version -ne $m.version) { throw 'Версии Cargo.toml и hub/manifest.json различаются' }
          "version=$($m.version)" >> $env:GITHUB_OUTPUT
      - name: Релиз уже есть?
        id: exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "hub-v${{ steps.v.outputs.version }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "skip=true" >> $env:GITHUB_OUTPUT } else { "skip=false" >> $env:GITHUB_OUTPUT }
          $global:LASTEXITCODE = 0
      - name: Сборка
        if: steps.exists.outputs.skip == 'false'
        shell: pwsh
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Сборка не удалась' }
          New-Item -ItemType Directory -Path stage/app -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/ThodShot.exe stage/app/ThodShot.exe
          Copy-Item hub/manifest.json stage/manifest.json
      - name: Упаковка и проверка
        if: steps.exists.outputs.skip == 'false'
        shell: pwsh
        run: |
          $notes = (Get-Content hub/notes.txt -Raw -Encoding UTF8).Trim()
          ./hub-tools/scripts/package-module.ps1 -PackageDirectory stage -Repository "${{ github.repository }}" -OutputDirectory out -Notes $notes
      - name: Публикация release
        if: steps.exists.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.v.outputs.version }}"
          gh release create "hub-v$v" "out/thodshot-$v-win-x64.zip" out/thodhub-release.json --target "${{ github.sha }}" --repo "${{ github.repository }}" --title "ThodShot $v" --notes-file hub/notes.txt --latest
