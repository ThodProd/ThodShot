[package]
name = "thodshot"
version = "1.2.3"
edition = "2024"
authors = ["ThodProd"]
description = "Native Windows screenshot utility for ThodHUB"

[[bin]]
name = "ThodShot"
path = "rust/src/main.rs"

[dependencies]
anyhow = "1.0"
arboard = "3.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.31", features = ["accesskit"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "ico"] }
tiny-skia = "0.11"
tray-icon = "0.19"
rfd = "0.15"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winreg = "0.55"
windows-future = "0.3"
windows = { version = "0.62", features = [
    "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_Shell", "Win32_System_Com",
    "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Foundation_Collections", "Win32_System_WinRT",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1"
